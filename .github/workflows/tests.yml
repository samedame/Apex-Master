name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apex_master_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas==2.3.3" "numpy==2.2.6" pyyaml "ruff==0.11.13"
      - name: Replay parity, exits, live loop, scoreboard, watchdog, scheduler
        run: python3 -m unittest discover -s tests -v
      - name: Lint and compile paper research modules
        run: |
          ruff check --select E9,F63,F7,F82,F401 apex_master_bot/{market_regime,option_replay,options_execution,risk,state_io,v2,v2_quotes}.py ../research/master_v3/validate.py
          python -m compileall -q apex_master_bot ../research/master_v3
      - name: Reproduce historical comparison
        run: PYTHONPATH=. python ../research/master_v3/validate.py > "$RUNNER_TEMP/apex-v3-validation.json"
