name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apex_master_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas==2.3.3" "numpy==2.2.6"
      - name: Replay parity, exits, live loop, scoreboard, watchdog, scheduler
        run: python3 -m unittest discover -s tests -v
