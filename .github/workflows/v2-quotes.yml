name: v2-quotes

# Started by master-session on Master v2 signal days only. Waits for 09:31 ET, then logs the real same-day option quotes
# next to the model-free fair values (ledger/v2_quotes.csv) and posts a QUOTE CHECK to Discord. Paper only: no orders.
on:
  workflow_dispatch:

concurrency:
  group: v2-quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PYTHONUNBUFFERED: "1"
      # Optional real-time option quotes. Unset = Yahoo exactly as before. A production key makes Tradier the first source.
      TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
      TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
    defaults:
      run:
        working-directory: apex_master_bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "pandas==2.3.3" "numpy==2.2.6" yfinance

      - name: Log real option quotes (waits for 09:31 ET)
        run: python3 -m apex_master_bot v2-quotes --state-dir state --ledger-dir ledger

      - name: Save quotes back to the repo
        if: always()
        working-directory: .
        run: |
          git config user.name "apex-master-bot"
          git config user.email "apex-master-bot@users.noreply.github.com"
          mkdir -p apex_master_bot/state/v2 apex_master_bot/ledger
          git add -A apex_master_bot/state/v2 apex_master_bot/ledger
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -q -m "apex-master v2 quotes $(TZ=America/New_York date +%F) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "could not push quotes after 5 tries"; exit 1

      - name: Alert Discord if the quote job failed
        if: failure()
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || exit 0
          curl -sS -o /dev/null -H "Content-Type: application/json" -A "apex-master-bot" \
            -d "{\"content\":\"APEX MASTER v2: the option quote job FAILED. The signal is unaffected; read the live chain by hand and log your fill. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$DISCORD_WEBHOOK_URL" || true
